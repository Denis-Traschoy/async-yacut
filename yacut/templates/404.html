{% extends "base.html" %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<section class="container my-5 px-4">
  <div class="container">
    <div class="row my-3">
      <div class="col-sm">
      </div>
      <div class="col-sm text-center">
        <h1 class="display-1">404</h1>
        <p class="lead">Страница не найдена</p>
        <p>К сожалению, запрашиваемая страница не существует или была удалена.</p>
        <a href="{{ url_for('views.index') }}" class="btn btn-primary">Вернуться на главную</a>
      </div>
      <div class="col-sm">
      </div>
    </div>
  </div>
</section>
{% endblock %}
